# Copyright (c) 1993-1994, 2026 Andy van Wezel
#
# Publishes a release when a version tag such as v5.3.0 is pushed. It builds and tests the program on
# every system it is released for, makes a CycloneDX SBOM for each binary, attests the build
# provenance of each binary and its SBOM, and attaches the binaries, the SBOMs and SHA256SUMS to a
# GitHub Release. The text of the release is the section of CHANGELOG.md for the version.
#
#   sillydes-X.Y.Z-linux-x86_64       Linux, x86-64, a static PIE: it needs no library of the system
#   sillydes-X.Y.Z-linux-arm64        Linux, arm64, the same
#   sillydes-X.Y.Z-macos-universal    macOS 11 or later, arm64 and x86-64 in one file; ad hoc signed
#                                     with the hardened runtime, not notarized
#   sillydes-X.Y.Z-windows-x86_64.exe Windows 10 or later (MSVC, the C++ runtime is linked in); not signed
#   sillydes-X.Y.Z-windows-arm64.exe  the same for arm64
#
# The attestations, and how to verify them:
#
#   build provenance   gh attestation verify <binary> --repo avw1ein/sillydes
#   SBOM               gh attestation verify <binary> --repo avw1ein/sillydes --predicate-type https://cyclonedx.org/bom
#
# Releases up to 5.2.0 are Linux x86-64 only, and have the SBOM attestation only.
#
# Started by hand (Run workflow) it is a dry run: it builds, tests and makes the SBOMs, keeps them as
# artifacts, and publishes and attests nothing.

name: release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: The tag must name the program version
        id: version
        run: |
          version=$(sed -n 's/^#define PACKAGE_VERSION "\(.*\)"/\1/p' src/version.h)
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match PACKAGE_VERSION $version in src/version.h" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: The changelog must describe this version
        run: |
          version=${{ steps.version.outputs.version }}
          mkdir notes
          awk -v v="$version" '
            /^## \[/ { on = (index($0, "## [" v "]") == 1); next }
            on { print }
          ' CHANGELOG.md > notes/notes.md
          if ! grep -q '[^[:space:]]' notes/notes.md; then
            if [ "$GITHUB_EVENT_NAME" = push ]; then
              echo "CHANGELOG.md has no entry for $version: add a '## [$version] - date' section" >&2
              exit 1
            fi
            echo "(dry run: no changelog entry for $version yet)" > notes/notes.md
          fi
          {
            echo ""
            echo "The binaries are not signed with a certificate (Authenticode on Windows) and the macOS binary is not"
            echo "notarized: Windows SmartScreen and macOS Gatekeeper may warn about a downloaded copy. Check the"
            echo "download against \`SHA256SUMS\` and with \`gh attestation verify <file> --repo $GITHUB_REPOSITORY\`,"
            echo "or build from source."
            echo ""
            echo "Full changelog: https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/CHANGELOG.md"
          } >> notes/notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: changelog-notes
          path: notes

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-22.04, ext: '' }
          - { name: linux-arm64, os: ubuntu-22.04-arm, ext: '' }
          - { name: macos-universal, os: macos-latest, ext: '' }
          - { name: windows-x86_64, os: windows-latest, ext: .exe }
          - { name: windows-arm64, os: windows-11-arm, ext: .exe }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The same builds and tests as the build workflow: warnings are errors, and the tests include
      # the check that the finished binary carries its hardening (and on macOS its signature).
      - name: Build and test
        run: |
          case "${{ matrix.name }}" in
            linux-*)
              # Static: the C and C++ libraries are in the binary (built on Ubuntu 22.04, whose glibc is
              # the one it carries). The tests run on that very binary.
              cmake --preset ci -DSILLYDES_STATIC=ON
              cmake --build --preset ci
              ctest --preset ci
              file build/ci/sillydes
              file build/ci/sillydes | grep -q "static" || { echo "the Linux binary is not static" >&2; exit 1; }
              echo "BIN=build/ci/sillydes" >> "$GITHUB_ENV" ;;
            macos-*)
              cmake --preset universal
              cmake --build --preset universal
              ctest --preset universal
              echo "BIN=build/universal/sillydes" >> "$GITHUB_ENV" ;;
            windows-*)
              cmake -S . -B build -DSILLYDES_WERROR=ON
              cmake --build build --config Release
              ctest --test-dir build -C Release --output-on-failure
              echo "BIN=build/Release/sillydes.exe" >> "$GITHUB_ENV" ;;
          esac

      - name: The program must say its version
        run: |
          version=${{ needs.prepare.outputs.version }}
          banner=$("$BIN" 2>&1 || true)
          echo "$banner" | head -n 3
          echo "$banner" | grep -q "SillyDES $version" || { echo "the banner does not name $version" >&2; exit 1; }

      - name: SBOM, and the files named after the release
        run: |
          version=${{ needs.prepare.outputs.version }}
          cache=$(find build -name CMakeCXXCompiler.cmake | head -n 1)
          export SBOM_PLATFORM="${{ matrix.name }}"
          export SBOM_COMPILER_NAME=$(sed -n 's/^set(CMAKE_CXX_COMPILER_ID "\(.*\)")/\1/p' "$cache")
          export SBOM_COMPILER_VERSION=$(sed -n 's/^set(CMAKE_CXX_COMPILER_VERSION "\(.*\)")/\1/p' "$cache")
          mkdir dist
          name="sillydes-$version-${{ matrix.name }}${{ matrix.ext }}"
          cp "$BIN" "dist/$name"
          bash tools/gen_sbom.sh "$BIN" > "dist/$name.cdx.json"
          ls -l dist
          head -c 1500 "dist/$name.cdx.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.name }}
          path: dist

  # One job per file: an attestation names exactly one subject, and a failed one must not hide
  # behind the others.
  attest:
    needs: [prepare, build]
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, ext: '' }
          - { name: linux-arm64, ext: '' }
          - { name: macos-universal, ext: '' }
          - { name: windows-x86_64, ext: .exe }
          - { name: windows-arm64, ext: .exe }
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write      # sign the attestation
      attestations: write  # store the attestation
    env:
      FILE: sillydes-${{ needs.prepare.outputs.version }}-${{ matrix.name }}${{ matrix.ext }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ matrix.name }}
          path: dist

      # Without sbom-path or a predicate this attests the build provenance of the binary: which
      # workflow, commit and runner made it. It is what `gh attestation verify` checks by default.
      # The NODE_OPTIONS are those that actions/attest-build-provenance sets around the same call.
      - name: Attest the build provenance of the binary
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        env:
          NODE_OPTIONS: '--max-http-header-size=32768'
        with:
          subject-path: dist/${{ env.FILE }}

      # With sbom-path this makes an SBOM attestation, as the deprecated actions/attest-sbom did;
      # that action was a wrapper around this one and set the same NODE_OPTIONS.
      - name: Attest the SBOM to the binary
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        env:
          NODE_OPTIONS: '--max-http-header-size=32768'
        with:
          subject-path: dist/${{ env.FILE }}
          sbom-path: dist/${{ env.FILE }}.cdx.json

  publish:
    needs: [prepare, build, attest]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the release and upload its files
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: changelog-notes
          path: notes

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: SHA256SUMS
        run: |
          cd dist
          ls -l
          [ "$(ls sillydes-*.cdx.json | wc -l)" = 5 ] || { echo "expected 5 SBOMs" >&2; exit 1; }
          [ "$(ls sillydes-* | grep -vc '\.cdx\.json$')" = 5 ] || { echo "expected 5 binaries" >&2; exit 1; }
          sha256sum sillydes-* > SHA256SUMS
          cat SHA256SUMS

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${{ needs.prepare.outputs.version }}
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "SillyDES $version" --notes-file notes/notes.md
