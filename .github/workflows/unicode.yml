#
# The Unicode tables in src/unicode_tables.h are committed and are part of the file format. This
# checks, whenever something they depend on changes, that they are exactly what the generator
# makes of the Unicode data files (downloaded here and checked against stored SHA-256 sums), and
# that the normalisation passes the complete conformance file of that Unicode version.
# Nothing is installed; the data files are not part of the build of the program.

name: unicode

on:
  push:
    paths:
      - 'src/text.*'
      - 'src/unicode_tables.h'
      - 'src/common.*'
      - 'tools/gen_unicode.cpp'
      - 'tools/fetch_ucd.sh'
      - 'test/unicode_conformance.cpp'
      - 'LICENSE.Unicode'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - '.github/workflows/unicode.yml'
  pull_request:
    paths:
      - 'src/text.*'
      - 'src/unicode_tables.h'
      - 'src/common.*'
      - 'tools/gen_unicode.cpp'
      - 'tools/fetch_ucd.sh'
      - 'test/unicode_conformance.cpp'
      - 'LICENSE.Unicode'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - '.github/workflows/unicode.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unicode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash tools/fetch_ucd.sh "$RUNNER_TEMP/ucd"
      - run: cmake -S . -B "$RUNNER_TEMP/build" -DSILLYDES_WERROR=ON -DSILLYDES_REGENERATE_UNICODE="$RUNNER_TEMP/ucd"
      - run: cmake --build "$RUNNER_TEMP/build" --target check_unicode
