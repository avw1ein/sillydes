#
# Builds and tests on a bare runner without installing anything first,
# which is the proof that the program has no dependencies beyond a C++
# compiler, make or CMake and the Linux system headers.

name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make CXXFLAGS="-O2 -Wall -Wextra -Werror -std=c++11"
      - run: make test
      # The SBOM describes the binary built above, so it is generated here and kept as an artifact.
      - run: make sbom
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sillydes-sbom
          path: sillydes.cdx.json

  # The same build and tests through CMake (PORTPLAN.md todo 1); the Makefile goes when this covers everything.
  cmake:
    strategy:
      fail-fast: false
      matrix:
        cxx: [g++, clang++]
    runs-on: ubuntu-latest
    env:
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cmake --preset ci
      - run: cmake --build --preset ci
      - run: ctest --preset ci
      - run: cmake --build --preset ci --target sbom
      - name: Files for the other systems (interop)
        if: matrix.cxx == 'g++'
        run: build/ci/test_e2e build/ci/sillydes . --interop-make interop linux-x64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.cxx == 'g++'
        with:
          name: interop-linux-x64
          path: interop
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.cxx == 'g++'
        with:
          name: bin-linux-x64
          path: |
            build/ci/sillydes
            build/ci/test_e2e

  # Windows, from the first platform file on (PORTPLAN.md todo 15): the Microsoft compiler and
  # MinGW-w64 are different compilers with different warnings, and users have both.
  windows-msvc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cmake -S . -B build -DSILLYDES_WERROR=ON
      - run: cmake --build build --config Release
      - run: ctest --test-dir build -C Release --output-on-failure -V
      - name: Files for the other systems (interop)
        run: build/Release/test_e2e.exe build/Release/sillydes.exe . --interop-make interop windows-msvc
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: interop-windows-msvc
          path: interop
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-windows-msvc
          path: |
            build/Release/sillydes.exe
            build/Release/test_e2e.exe

  # The native Windows arm64 runner (PORTPLAN.md todo 11): the same build as windows-msvc.
  windows-arm64:
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cmake -S . -B build -DSILLYDES_WERROR=ON
      - run: cmake --build build --config Release
      - run: ctest --test-dir build -C Release --output-on-failure -V
      - name: Files for the other systems (interop)
        run: build/Release/test_e2e.exe build/Release/sillydes.exe . --interop-make interop windows-arm64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: interop-windows-arm64
          path: interop
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-windows-arm64
          path: |
            build/Release/sillydes.exe
            build/Release/test_e2e.exe

  windows-mingw:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: msys2/setup-msys2@3c51bf698df1e37b2261f53cb67797b97761185c # v2.34.0
        with:
          msystem: UCRT64
          update: false
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja
      - run: cmake -S . -B build -G Ninja -DSILLYDES_WERROR=ON
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure -V
      # Outside the MSYS2 shell, whose search path has no PowerShell 7; the program is linked statically.
      - name: Files for the other systems (interop)
        shell: pwsh
        run: build/test_e2e.exe build/sillydes.exe . --interop-make interop windows-mingw
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: interop-windows-mingw
          path: interop
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-windows-mingw
          path: |
            build/sillydes.exe
            build/test_e2e.exe

  # macOS on both architectures (PORTPLAN.md todos 15 and 6): Apple clang, arm64 and Intel, one
  # architecture and the universal binary. A universal binary runs its own slice on each runner, so
  # both slices are tested natively; the signature and the hardened runtime are checked by ctest.
  macos:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel]
        preset: [ci, universal]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cmake --preset ${{ matrix.preset }}
      - run: cmake --build --preset ${{ matrix.preset }}
      - run: ctest --preset ${{ matrix.preset }}
      - name: Signature and architectures
        run: |
          lipo -archs build/${{ matrix.preset }}/sillydes
          codesign -dvv build/${{ matrix.preset }}/sillydes
          codesign -d --entitlements - build/${{ matrix.preset }}/sillydes
      - name: Files for the other systems (interop)
        if: matrix.preset == 'ci'
        run: build/ci/test_e2e build/ci/sillydes . --interop-make interop ${{ matrix.os == 'macos-latest' && 'macos-arm64' || 'macos-x64' }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.preset == 'ci'
        with:
          name: interop-${{ matrix.os == 'macos-latest' && 'macos-arm64' || 'macos-x64' }}
          path: interop
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.preset == 'ci'
        with:
          name: bin-${{ matrix.os == 'macos-latest' && 'macos-arm64' || 'macos-x64' }}
          path: |
            build/ci/sillydes
            build/ci/test_e2e

  # The native arm64 runner: the whole suite, with PAC and BTI in the binary and DIT switched on where
  # the CPU has it (PORTPLAN.md 4.2, 5.2).
  linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cmake --preset ci
      - run: cmake --build --preset ci
      - run: ctest --preset ci
      - name: Files for the other systems (interop)
        run: build/ci/test_e2e build/ci/sillydes . --interop-make interop linux-arm64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: interop-linux-arm64
          path: interop
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-linux-arm64
          path: |
            build/ci/sillydes
            build/ci/test_e2e

  # Big endian (PORTPLAN.md todo 11): s390x under QEMU user mode, cross-compiled. The unit tests run
  # there, and the files made there and by the x86-64 build open on the other one: the format is bytes,
  # not memory images. The end-to-end test is not run (QEMU does not limit the address space of a
  # child, and the residue scan preloads a library into a native process).
  big-endian:
    runs-on: ubuntu-latest
    env:
      QEMU_LD_PREFIX: /usr/s390x-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y g++-s390x-linux-gnu qemu-user-static
      - run: cmake --preset ci && cmake --build --preset ci --target sillydes test_e2e
      - run: cmake -S . -B build-s390x -DCMAKE_SYSTEM_NAME=Linux -DCMAKE_SYSTEM_PROCESSOR=s390x -DCMAKE_CXX_COMPILER=s390x-linux-gnu-g++ -DSILLYDES_WERROR=ON
      - run: cmake --build build-s390x --target sillydes test_primitives test_e2e
      - run: file build-s390x/sillydes && build-s390x/test_primitives
      - run: |
          build-s390x/test_e2e build-s390x/sillydes . --interop-make interop s390x
          build/ci/test_e2e build/ci/sillydes . --interop-make interop linux-x64
          build/ci/test_e2e build/ci/sillydes . --interop-check interop s390x,linux-x64
          build-s390x/test_e2e build-s390x/sillydes . --interop-check interop s390x,linux-x64

  # AddressSanitizer and UndefinedBehaviorSanitizer. The end-to-end test runs without its residue scan
  # (a preloaded scanner does not go with the sanitizer's allocator) and without the memory limit.
  sanitize:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cmake -S . -B build -DSILLYDES_SANITIZE=ON -DSILLYDES_WERROR=ON
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure -V

  # Files made by every system's own build are opened by every system's build: binary and armored, with
  # a key file, an ASCII phrase and a non-ASCII phrase (also typed another way), and on Windows through
  # PowerShell and cmd.exe (PORTPLAN.md todo 11, README section 1).
  interop:
    needs: [cmake, linux-arm64, macos, windows-msvc, windows-arm64, windows-mingw]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: linux-x64, os: ubuntu-latest }
          - { label: linux-arm64, os: ubuntu-24.04-arm }
          - { label: macos-arm64, os: macos-latest }
          - { label: macos-x64, os: macos-15-intel }
          - { label: windows-msvc, os: windows-latest }
          - { label: windows-mingw, os: windows-latest }
          - { label: windows-arm64, os: windows-11-arm }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: interop-*
          merge-multiple: true
          path: interop
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bin-${{ matrix.label }}
          path: bin
      - run: |
          exe=bin/sillydes
          [ -f "$exe.exe" ] && exe="$exe.exe"
          chmod +x bin/* 2>/dev/null || true
          ls interop
          bin/test_e2e* "$exe" . --interop-check interop linux-x64,linux-arm64,macos-arm64,macos-x64,windows-msvc,windows-mingw,windows-arm64
